<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="heebo.css">
<style>
  /* KRALDOR Discord cover — authored at 1920x1080 and scaled down for the
     960x540 server banner, so both exports are literally the same artwork.
     NOTE: no blanket `#stage > *` positioning rule. An id-scoped rule outranks
     every class below it, and it silently ate the frame inset and the lockup's
     top offset on the first pass. Each layer positions itself. */
  html,body{margin:0;padding:0;background:#08080b;overflow:hidden}
  #stage{
    position:relative;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;
    font-family:'Heebo',system-ui,sans-serif;
    background:
      radial-gradient(112% 76% at 50% -16%, rgba(150,120,40,.26), transparent 60%),
      radial-gradient(58% 50% at 12% 44%, rgba(26,24,30,.7), transparent 64%),
      radial-gradient(58% 50% at 88% 44%, rgba(26,24,30,.7), transparent 64%),
      linear-gradient(180deg,#100e0d 0%,#0b0a0b 44%,#070607 100%);
  }
  .layer{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}

  /* left/right + corner vignette, matching the site body */
  .vig{background:
      linear-gradient(90deg,rgba(0,0,0,.72) 0%,transparent 26%,transparent 74%,rgba(0,0,0,.72) 100%),
      radial-gradient(126% 108% at 50% 40%, transparent 58%, rgba(0,0,0,.55) 100%);}

  /* ornate gold frame — hairline + inner bone hairline + corner brackets */
  .frame{
    position:absolute;left:34px;top:34px;right:34px;bottom:34px;
    border:1px solid rgba(196,160,50,.36);
    box-shadow:inset 0 0 140px -70px rgba(196,160,50,.45);
  }
  .frame::after{content:"";position:absolute;left:11px;top:11px;right:11px;bottom:11px;
    border:1px solid rgba(214,201,173,.12)}
  .br{position:absolute;width:78px;height:78px;border:2px solid rgba(228,195,90,.7);
      box-shadow:0 0 18px -6px rgba(228,195,90,.6)}
  .br-tl{top:34px;left:34px;right:auto;bottom:auto;border-right:0;border-bottom:0}
  .br-tr{top:34px;right:34px;left:auto;bottom:auto;border-left:0;border-bottom:0}
  .br-bl{bottom:34px;left:34px;right:auto;top:auto;border-right:0;border-top:0}
  .br-br{bottom:34px;right:34px;left:auto;top:auto;border-left:0;border-top:0}

  /* ---- the lockup ---- */
  .lockup{position:absolute;left:0;right:0;top:150px;display:flex;
          flex-direction:column;align-items:center}
  .crest{filter:drop-shadow(0 20px 46px rgba(0,0,0,.95)) drop-shadow(0 0 52px rgba(196,160,50,.26))}
  .word{
    margin-top:32px;font-weight:900;font-size:150px;line-height:1;letter-spacing:.19em;
    color:#efe6ce;padding-left:.19em;
    text-shadow:0 8px 40px rgba(0,0,0,.92), 0 0 70px rgba(196,160,50,.28);
  }
  .word b{color:#e4c35a}
  .sub{margin-top:16px;direction:rtl;font-weight:800;font-size:38px;letter-spacing:.46em;
       color:#c2b184;padding-right:.46em;text-shadow:0 3px 18px rgba(0,0,0,.95)}
  .div{display:flex;align-items:center;gap:24px;margin-top:34px}
  .div i{display:block;width:260px;height:1px;background:linear-gradient(90deg,transparent,#8f7a45)}
  .div i+i{background:linear-gradient(90deg,#8f7a45,transparent)}
  .div s{display:block;width:14px;height:14px;background:#e4c35a;transform:rotate(45deg);
         box-shadow:0 0 18px rgba(228,195,90,.8)}
  .tag{margin-top:30px;direction:rtl;font-weight:700;font-size:36px;letter-spacing:.09em;
       color:#d6c9ad;opacity:.9;text-shadow:0 3px 18px rgba(0,0,0,.98)}
  .tag em{font-style:normal;color:#c4a032;margin:0 .42em}
  .ember{position:absolute;border-radius:50%;background:#e4c35a;filter:blur(.6px)}
</style>
</head>
<body>
<div id="stage">
  <svg class="layer" viewBox="0 0 1920 1080" preserveAspectRatio="none" id="sky"></svg>
  <div class="layer vig"></div>
  <div class="frame"></div>
  <i class="br br-tl"></i><i class="br br-tr"></i><i class="br br-bl"></i><i class="br br-br"></i>

  <div class="lockup">
    <div class="crest" id="crest"></div>
    <div class="word">KRA<b>L</b>DOR</div>
    <div class="sub">קראלדור</div>
    <div class="div"><i></i><s></s><i></i></div>
    <div class="tag">ממלכות<em>·</em>בריתות<em>·</em>מלחמה</div>
  </div>
</div>

<script src="crest.js"></script>
<script>
  document.getElementById('crest').innerHTML = crest('cv', 228);

  /* ---------- the silhouetted war-scape along the bottom ----------
     Two citadels in depth: a far one drawn smaller, higher and a shade lighter
     (atmospheric perspective), veiled by haze, and the near one in near-black.
     Both stay in the bottom ~30% so the lockup never fights them — and so
     Discord's server-name overlay lands on flat dark. Dead centre is a low
     gatehouse rather than the tallest keep, which keeps the wordmark clear. */
  const P = [];
  const push = (d, fill, extra = '') => P.push(`<path d="${d}" fill="${fill}" ${extra}/>`);

  P.push(`<defs>
    <radialGradient id="hz" cx="0.5" cy="0.72" r="0.62">
      <stop offset="0"   stop-color="#d8b04a" stop-opacity="0.40"/>
      <stop offset="0.5" stop-color="#8f6a1c" stop-opacity="0.16"/>
      <stop offset="1"   stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191521" stop-opacity="0"/>
      <stop offset="1" stop-color="#191521" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="pennant" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e4c35a"/><stop offset="1" stop-color="#a9861f"/>
    </linearGradient>
    <radialGradient id="gate" cx="0.5" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#e4c35a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e4c35a" stop-opacity="0"/>
    </radialGradient>
  </defs>`);

  /** One crenellated curtain wall + its towers, all in a single flat value.
      `lights` punches warm windows into the towers so the near silhouette
      reads as an inhabited city rather than a black shape. */
  function citadel({ ground, wallTop, fill, towers, merlon, flags, lights }) {
    let wall = `M0,${ground} L0,${wallTop}`;
    for (let x = 0; x < 1920; x += merlon * 1.8) {
      wall += ` L${x},${wallTop} L${x},${wallTop - merlon * 0.55} ` +
              `L${x + merlon},${wallTop - merlon * 0.55} L${x + merlon},${wallTop}`;
    }
    wall += ` L1920,${wallTop} L1920,${ground} Z`;
    push(wall, fill);

    for (const [cx, hw, top, spire] of towers) {
      push(`M${cx-hw},${ground} L${cx-hw},${top} L${cx+hw},${top} L${cx+hw},${ground} Z`, fill);
      const lw = hw + merlon * 0.3, tooth = merlon * 0.5, step = merlon * 0.9;
      let cren = `M${cx-lw},${top+6} L${cx-lw},${top-tooth*0.5}`;
      for (let x = cx - lw; x < cx + lw; x += step) {
        cren += ` L${x},${top-tooth*0.5} L${x},${top-tooth*1.6} ` +
                `L${x+tooth},${top-tooth*1.6} L${x+tooth},${top-tooth*0.5}`;
      }
      cren += ` L${cx+lw},${top-tooth*0.5} L${cx+lw},${top+6} Z`;
      push(cren, fill);
      if (spire) {
        const apex = top - tooth * 1.6 - hw * 1.5;
        push(`M${cx-lw},${top-tooth*1.6} L${cx},${apex} L${cx+lw},${top-tooth*1.6} Z`, fill);
        // `spire === 2` means "and fly a pennant" — reserved for the outer
        // towers, so nothing gold ever climbs into the tagline's line.
        if (flags && spire === 2) {
          push(`M${cx-2},${apex} L${cx+2},${apex} L${cx+2},${apex-46} L${cx-2},${apex-46} Z`, '#9c8748');
          push(`M${cx+2},${apex-44} L${cx+36},${apex-33} L${cx+2},${apex-22} Z`,
               'url(#pennant)', 'opacity="0.9"');
        }
      }
      if (lights) {
        // deterministic window grid — two columns, rows down from the parapet
        const rows = Math.floor((ground - top - 40) / 46);
        for (let r = 0; r < rows; r++) {
          for (const s of [-1, 1]) {
            if ((r + (s > 0 ? 1 : 0) + cx) % 3 === 0) continue; // a few dark windows
            const x = cx + s * hw * 0.42 - 3, y = top + 30 + r * 46;
            P.push(`<rect x="${x}" y="${y}" width="6" height="11" rx="3" fill="#e4c35a" opacity="${r === 0 ? 0.5 : 0.34}"/>`);
          }
        }
      }
    }
  }

  // FAR citadel — smaller, higher, a shade off the sky, then veiled in haze
  citadel({
    ground: 1020, wallTop: 936, fill: '#1b1726', merlon: 18, flags: false,
    towers: [
      [96, 24, 878, 0], [300, 20, 900, 1], [520, 26, 860, 1], [760, 20, 896, 0],
      [1150, 20, 896, 0], [1390, 26, 860, 1], [1610, 20, 900, 1], [1830, 24, 878, 0],
    ],
  });
  P.push(`<rect x="0" y="836" width="1920" height="204" fill="url(#haze)"/>`);

  // Amber battle-glow on the horizon — drawn BETWEEN the two citadels on
  // purpose: it backlights the near silhouette, which is otherwise so close to
  // the sky value that its lit windows read as dots floating in empty space.
  P.push(`<ellipse cx="960" cy="1010" rx="900" ry="300" fill="url(#hz)"/>`);

  // NEAR citadel — the foreground silhouette, lit from within
  citadel({
    ground: 1080, wallTop: 992, fill: '#0b0912', merlon: 30, flags: true, lights: true,
    towers: [
      [176, 42, 906, 0], [432, 34, 934, 2], [700, 50, 880, 1],
      [880, 30, 950, 0], [1040, 30, 950, 0],          // the gatehouse pair
      [1220, 50, 880, 1], [1488, 34, 934, 2], [1744, 42, 906, 0],
    ],
  });

  // the gate itself: an arch of warm light between the gatehouse towers
  P.push(`<ellipse cx="960" cy="1076" rx="86" ry="120" fill="url(#gate)"/>`);
  push('M918,1080 L918,1018 Q960,974 1002,1018 L1002,1080 Z', '#f0d478', 'opacity="0.30"');
  push('M930,1080 L930,1022 Q960,988 990,1022 L990,1080 Z', '#0b0912', 'opacity="0.75"');

  // foreground ridge, near-black, anchors the bottom edge
  push('M0,1080 L0,1042 L200,1024 L400,1048 L600,1028 L820,1052 L1020,1030 ' +
       'L1240,1054 L1450,1028 L1660,1048 L1860,1026 L1920,1040 L1920,1080 Z', '#040306');

  // warm scatter drifting IN FRONT of the near citadel — lifts the towers'
  // feet out of pure black and ties the bottom third back to the gold palette
  P.push(`<ellipse cx="960" cy="1040" rx="920" ry="200" fill="url(#hz)" opacity="0.5"/>`);

  document.getElementById('sky').innerHTML = P.join('');

  /* ---------- embers (fixed table, never random) ---------- */
  const st = document.getElementById('stage');
  [[236,452,3,.40],[352,690,2,.28],[540,318,2,.24],[1398,428,3,.36],[1576,672,2,.28],
   [1690,352,2,.22],[744,806,2,.30],[1204,828,3,.26],[452,860,2,.24],[1494,846,2,.20],
   [128,738,2,.20],[1806,760,2,.18],[960,806,2,.22]].forEach(([x,y,r,o]) => {
    const e = document.createElement('i');
    e.className = 'ember';
    e.style.cssText = `left:${x-r}px;top:${y-r}px;width:${r*2}px;height:${r*2}px;opacity:${o}`;
    st.appendChild(e);
  });

  /* ---------- scale the 1920 stage down for the 960 banner export ---------- */
  const w = Number(new URLSearchParams(location.search).get('w') || 1920);
  if (w !== 1920) document.getElementById('stage').style.transform = `scale(${w / 1920})`;
</script>
</body>
</html>
